name: PR preview

# Every pull request from this repository gets its own copy of the site at
# https://<user>.github.io/menu-lock/pr-preview/pr-<number>/, rebuilt on each
# push and removed when the PR is closed. The link is posted on the PR.
#
# Requires GitHub Pages to serve the `gh-pages` branch (Settings → Pages →
# Build and deployment → Source: Deploy from a branch → gh-pages, / (root));
# deploy.yml publishes the live site to the same branch, around pr-preview/.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write # push the preview to gh-pages
  pull-requests: write # comment the preview link

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Pull requests from forks get a read-only token and can't publish.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      # Same build as the live site, under the preview's path. VITE_PREVIEW
      # shows "preview · pr-N" under the logo and gives the preview its own
      # localStorage key, so trying it can't touch the live app's data.
      - name: Build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          VITE_PREVIEW: pr-${{ github.event.number }}
        run: npm run build

      - name: Publish or remove the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
